repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^src/claude_builder/templates/
      - id: end-of-file-fixer
        exclude: ^src/claude_builder/templates/
      - id: check-yaml
        exclude: ^src/claude_builder/templates/
      - id: check-added-large-files
        # uv.lock is intentionally large (~600 KB) and is the source of truth.
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-json
        exclude: ^src/claude_builder/templates/
      - id: check-toml
        exclude: ^src/claude_builder/templates/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^src/claude_builder/templates/

  - repo: https://github.com/PyCQA/isort
    rev: 8.0.1
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88]
        exclude: ^src/claude_builder/templates/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --select=F,E402,E403,E501,E711,E712,E713,E714,E721,E722,E731,E741,E742,E743,E902,E999, --ignore=T201,S314,S603,S607]
        exclude: ^(src/claude_builder/templates/|scripts/)
      - id: ruff-format
        exclude: ^src/claude_builder/templates/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        additional_dependencies: [types-toml, types-click, types-PyYAML, types-aiofiles]
        args: [--config-file=pyproject.toml, --ignore-missing-imports]
        exclude: ^(tests/|src/claude_builder/templates/|scripts/)

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        # Enforce all rules except MD033 (inline HTML) for template docs
        # This matches CI configuration to catch issues before push
        args: [--disable, MD033, --fix]
        exclude: ^src/claude_builder/templates/
