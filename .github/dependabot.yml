# Dependabot configuration for claude-builder
# This file configures Dependabot version updates for the project
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    reviewers:
      - "bloqaudio"
    assignees:
      - "bloqaudio"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    # increase-if-necessary preserves existing floors when transitive bumps satisfy them,
    # avoiding the floor-rewriting that produced the click 8.3.3 / semgrep 1.161 conflict.
    versioning-strategy: "increase-if-necessary"
    groups:
      # Bundle dev/test tooling so a tool-version wave (mypy + ruff + pytest etc.)
      # arrives as one PR and breaks/passes CI atomically.
      dev-tooling:
        patterns:
          - "pytest*"
          - "black"
          - "ruff"
          - "mypy"
          - "isort"
          - "pre-commit"
          - "bandit"
          - "safety"
          - "semgrep"
          - "coverage*"
          - "radon"
          - "interrogate"
          - "detect-secrets"
          - "build"
          - "types-*"
      runtime-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "pytest*"
          - "black"
          - "ruff"
          - "mypy"
          - "isort"
          - "pre-commit"
          - "bandit"
          - "safety"
          - "semgrep"
          - "coverage*"
          - "radon"
          - "interrogate"
          - "detect-secrets"
          - "build"
          - "types-*"
    ignore:
      # Ignore major version updates for critical dependencies (manual review required)
      - dependency-name: "click"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "rich"
        update-types: ["version-update:semver-major"]
      # Transitive dependencies managed by their parent packages — never bump independently
      - dependency-name: "pydantic-core"
      - dependency-name: "typing-inspection"
      - dependency-name: "typing-extensions"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    reviewers:
      - "bloqaudio"
    assignees:
      - "bloqaudio"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
